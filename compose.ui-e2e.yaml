services:
  api:
    image: kpapers-api:e2e
    environment:
      E2E_FIXTURE_MODE: "true"
      E2E_FIXTURE_DIR: /fixtures
      PUBLIC_BASE_URL: http://web
      COOKIE_SECURE: "false"
    volumes:
      - ${E2E_FIXTURE_HOST_DIR:?Set E2E_FIXTURE_HOST_DIR}/current-month:/fixtures/current-month:ro

  web:
    image: kpapers-web:e2e
    ports: []

  ui-e2e:
    build:
      context: ./web
      dockerfile: Dockerfile.e2e
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_BASE_URL: http://web
      OPERATOR_USERNAME: operator
      OPERATOR_PASSWORD: ${E2E_OPERATOR_PASSWORD:?Set E2E_OPERATOR_PASSWORD}
      CI: ${CI:-false}
    networks: [app]
