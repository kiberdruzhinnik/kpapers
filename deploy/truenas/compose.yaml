services:
  kpapers-api:
    image: ghcr.io/kiberdruzhinnik/kpapers-api:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///data/kpapers.sqlite?mode=rwc
      KPAPERS_PROXY_URL: ${KPAPERS_PROXY_URL:-}
    volumes:
      - ./kpapers_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/kpapers-api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  kpapers-web:
    image: ghcr.io/kiberdruzhinnik/kpapers-web:${IMAGE_TAG:-latest}
    depends_on:
      kpapers-api:
        condition: service_healthy
    environment:
      API_URL: http://kpapers-api:8080
    networks:
      - default
      - npm
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  npm:
    external: true
