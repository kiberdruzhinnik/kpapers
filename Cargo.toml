[package]
name = "kpapers-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
pdf_oxide = { version = "0.3.78", features = ["jpeg2000"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libcaesium = { version = "0.21.2", default-features = false, features = ["jpg"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[patch.crates-io]
pdf_oxide = { path = "vendor/pdf_oxide" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
