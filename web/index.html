<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kpapers · Feed desk</title>
    <style>
      :root { color-scheme: light; --ink:#202c2b; --muted:#65716c; --line:#d9e1da; --paper:#f6f7f2; --green:#1c6656; --soft:#e8efea; }
      * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif }
      header { padding:1.4rem max(1.25rem,calc((100vw - 1080px)/2)); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:#fff }
      h1,h2,h3,p { margin-top:0 } h1 { margin:0; font:600 1.3rem Georgia,serif; letter-spacing:.02em } main { max-width:1080px; margin:2rem auto; padding:0 1.25rem }
      .layout { display:grid; grid-template-columns:300px 1fr; gap:1.5rem } section,.panel { background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.25rem }
      h2 { font:600 1.2rem Georgia,serif } h3 { font-size:1rem; margin-bottom:.5rem } label { display:block; margin:.85rem 0 .25rem; color:var(--muted); font-size:.85rem }
      input,textarea,select,button { font:inherit } input,textarea,select { width:100%; border:1px solid var(--line); border-radius:8px; padding:.65rem .75rem; background:#fff; color:var(--ink) }
      button { border:0; border-radius:8px; padding:.65rem .9rem; color:#fff; background:var(--green); cursor:pointer; font-weight:600 } button.secondary { background:var(--soft); color:var(--ink) } button.danger { background:#8e3b36 }
      form button { margin-top:.9rem } .feed-list { display:grid; gap:.5rem } .feed-option { display:block; width:100%; text-align:left; color:var(--ink); background:var(--soft); font-weight:500 }
      .muted { color:var(--muted); font-size:.9rem } .stack { display:grid; gap:1rem } .row { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center } .row>* { flex:1 1 12rem; min-width:0 } .row>button { flex:0 0 auto; margin-top:0 } .row>h2,.row>h3 { flex:1 1 auto }
      .month-form { display:grid; grid-template-columns:minmax(10rem, .8fr) minmax(16rem, 2fr) auto; gap:.6rem; align-items:end; margin:1rem 0 }
      .month-form button { margin:0 }
      .month { display:grid; grid-template-columns:minmax(0,1fr); gap:.75rem; border:1px solid var(--line); border-radius:10px; padding:1rem; margin-top:.75rem; min-width:0 }
      .month-name { display:block; font-size:1.05rem }
      .month-source { min-width:0; overflow-wrap:anywhere; margin-top:.25rem }
      .month-status { border-radius:8px; background:var(--paper); padding:.65rem .75rem; overflow-wrap:anywhere }
      .month-status-title { font-weight:600; margin-bottom:.25rem }
      .month-status-details { margin:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr)); gap:.25rem .8rem; white-space:pre-line }
      .month-actions { display:flex; flex-wrap:wrap; align-items:center; gap:.55rem; border-top:1px solid var(--line); padding-top:.75rem }
      .month-actions button { flex:0 1 auto; margin:0 }
      .notice { padding:.7rem .9rem; border-radius:8px; background:var(--soft); margin-bottom:1rem } .error { background:#f8e6e2; color:#7a2f27 } .hidden { display:none!important } .small { font-size:.82rem } a { color:var(--green) }
      @media(max-width:760px){ .layout{grid-template-columns:1fr} header{padding:1rem 1.25rem} .month-form{grid-template-columns:1fr} .month-actions button{flex:1 1 10rem} }
    </style>
  </head>
  <body>
    <header><h1>Kpapers <span class="muted">/ feed desk</span></h1><button id="logout" class="secondary hidden">Sign out</button></header>
    <main>
      <p id="notice" class="notice hidden" role="status"></p>
      <section id="login-panel" class="panel" style="max-width:440px;margin:4rem auto">
        <h2>Operator sign in</h2><p class="muted">Sign in to manage author feeds and source folders.</p>
        <form id="login-form"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign in</button></form>
      </section>
      <div id="desk" class="layout hidden">
        <aside class="stack">
          <section><h2>Your feeds</h2><div id="feeds" class="feed-list"></div><div id="archived-feed-list"></div></section>
          <section><h3>Create a feed</h3><form id="feed-form"><label>Author name</label><input name="display_name" required><label>Description</label><textarea name="description" rows="3"></textarea><label>Refresh interval override (hours, optional)</label><input name="refresh_hours" type="number" min="0.1" step="0.1" placeholder="Use current/older month defaults"><button>Create feed</button></form></section>
        </aside>
        <section id="detail"><h2>Choose a feed</h2><p class="muted">Add years, then link only the months that have a source folder.</p></section>
      </div>
    </main>
    <script>
      const $ = (s) => document.querySelector(s);
      const api = async (path, options={}) => { const r=await fetch(path,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}); if(!r.ok) throw Error(r.status===401?'Please sign in again.':`Request failed (${r.status}).`); return r.status===204?null:r.json(); };
      let selected = null;
      function say(message,error=false){const n=$('#notice');n.textContent=message;n.classList.remove('hidden','error');if(error)n.classList.add('error');setTimeout(()=>n.classList.add('hidden'),4500)}
      function formData(form){return Object.fromEntries(new FormData(form).entries())}
      function feedPayload(form){const d=formData(form);const hours=Number(d.refresh_hours);delete d.refresh_hours;d.refresh_interval_seconds=hours>0?Math.round(hours*3600):null;return d}
      function actionButton(text, className, action){const b=document.createElement('button');b.type='button';b.className=className;b.textContent=text;b.onclick=()=>action().catch(err=>say(err.message,true));return b}
      async function load(){try{await api('/api/management/session');$('#login-panel').classList.add('hidden');$('#desk').classList.remove('hidden');$('#logout').classList.remove('hidden');const feeds=await api('/api/management/feeds');const active=feeds.filter(f=>f.active);const archived=feeds.filter(f=>!f.active);$('#feeds').replaceChildren(...active.map(f=>{const b=document.createElement('button');b.className='feed-option';b.textContent=f.display_name;b.onclick=()=>openFeed(f);return b}));const archivedPanel=$('#archived-feed-list');archivedPanel.replaceChildren();if(archived.length){const h=document.createElement('h3');h.textContent='Archived feeds';archivedPanel.append(h,...archived.map(f=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=f.display_name;row.append(name,actionButton('Restore feed','secondary',async()=>{await api(`/api/management/feeds/${f.id}/restore`,{method:'POST'});say('Feed restored.');await load()}),actionButton('Delete permanently','danger',async()=>{if(!confirm(`Permanently delete ${f.display_name} and all its years, months, cached PDFs, and refresh history? This cannot be undone.`))return;await api(`/api/management/feeds/${f.id}/permanent`,{method:'DELETE'});say('Feed permanently deleted.');await load()}));return row}))}if(selected){selected=feeds.find(f=>f.id===selected.id&&f.active)||null}if(selected)await openFeed(selected)}catch(e){$('#login-panel').classList.remove('hidden');$('#desk').classList.add('hidden');$('#logout').classList.add('hidden')}}
      async function openFeed(feed){selected=feed;const years=await api(`/api/management/feeds/${feed.id}/years`);const detail=$('#detail');detail.replaceChildren();const heading=document.createElement('div');heading.className='row';const title=document.createElement('h2');title.textContent=feed.display_name;heading.append(title,actionButton('Force refetch feed','secondary',async()=>{await api(`/api/management/feeds/${feed.id}/refresh`,{method:'POST'});say('Feed refetch queued.')}),actionButton('Archive feed','secondary',async()=>{if(!confirm(`Archive ${feed.display_name}? It and its contents will be hidden from refresh and RSS. You can restore it later.`))return;await api(`/api/management/feeds/${feed.id}/archive`,{method:'POST'});selected=null;say('Feed archived.');await load()}),actionButton('Delete permanently','danger',async()=>{if(!confirm(`Permanently delete ${feed.display_name} and all its years, months, cached PDFs, and refresh history? This cannot be undone.`))return;await api(`/api/management/feeds/${feed.id}/permanent`,{method:'DELETE'});selected=null;say('Feed permanently deleted.');await load()}));detail.append(heading);const desc=document.createElement('p');desc.className='muted';desc.textContent=feed.description||'No description';detail.append(desc);const url=document.createElement('p');url.className='small';url.innerHTML='Stable RSS URL: <code></code>';url.querySelector('code').textContent=`/feeds/${feed.id}`;detail.append(url);
        const edit=document.createElement('form');edit.innerHTML='<h3>Edit feed</h3><label>Author name</label><input name="display_name" required><label>Description</label><textarea name="description" rows="2"></textarea><label>Refresh interval override (hours, optional)</label><input name="refresh_hours" type="number" min="0.1" step="0.1" placeholder="Use current/older month defaults"><button class="secondary">Save details</button>';edit.elements.display_name.value=feed.display_name;edit.elements.description.value=feed.description;edit.elements.refresh_hours.value=feed.refresh_interval_seconds?feed.refresh_interval_seconds/3600:'';edit.onsubmit=async e=>{e.preventDefault();try{await api(`/api/management/feeds/${feed.id}`,{method:'PUT',body:JSON.stringify(feedPayload(edit))});say('Feed details saved. Its RSS URL stays the same.');await load()}catch(err){say(err.message,true)}};detail.append(edit);
        const yearForm=document.createElement('form');yearForm.innerHTML='<h3>Add a year</h3><label>Year</label><input name="year" type="number" min="1" max="9999" required><button>Add year</button>';yearForm.onsubmit=async e=>{e.preventDefault();try{await api(`/api/management/feeds/${feed.id}/years`,{method:'POST',body:JSON.stringify({year:Number(yearForm.elements.year.value)})});say('Year added. Create only the months that have folders.');await openFeed(feed)}catch(err){say(err.message,true)}};detail.append(yearForm);
        for(const y of years){const block=document.createElement('div');block.className='panel';block.style.marginTop='1rem';const yearHeading=document.createElement('div');yearHeading.className='row';const yearTitle=document.createElement('h3');yearTitle.textContent=String(y.year);yearHeading.append(yearTitle);if(y.active){yearHeading.append(actionButton('Force refetch year','secondary',async()=>{await api(`/api/management/feeds/${feed.id}/years/${y.year}/refresh`,{method:'POST'});say(`${y.year} refetch queued.`)}),actionButton('Archive year','secondary',async()=>{if(!confirm(`Archive ${y.year} and its months? Its entries will be hidden from refresh and RSS until restored.`))return;await api(`/api/management/feeds/${feed.id}/years/${y.year}/archive`,{method:'POST'});say('Year archived.');await openFeed(feed)}))}else{yearHeading.append(actionButton('Restore year','secondary',async()=>{await api(`/api/management/feeds/${feed.id}/years/${y.year}/restore`,{method:'POST'});say('Year restored.');await openFeed(feed)}))}yearHeading.append(actionButton('Delete permanently','danger',async()=>{if(!confirm(`Permanently delete ${y.year} and all its months, cached PDFs, and refresh history? This cannot be undone.`))return;await api(`/api/management/feeds/${feed.id}/years/${y.year}`,{method:'DELETE'});say('Year permanently deleted.');await openFeed(feed)}));block.append(yearHeading);
          const linkHeading=document.createElement('h4');linkHeading.textContent='Link a month';linkHeading.className='month-link-heading';block.append(linkHeading);
          const mf=document.createElement('form');mf.className='month-form';mf.innerHTML=`<select name="month" aria-label="Month" required ${y.active?'':'disabled'}><option value="">Choose month</option>${['January','February','March','April','May','June','July','August','September','October','November','December'].map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select><input name="source_url" type="url" aria-label="Public cloud folder link" placeholder="Public cloud folder link" required ${y.active?'':'disabled'}><button ${y.active?'':'disabled'}>Link month</button>`;mf.onsubmit=async e=>{e.preventDefault();try{const d=formData(mf);await api(`/api/management/feeds/${feed.id}/years/${y.year}/months/${d.month}`,{method:'PUT',body:JSON.stringify({source_url:d.source_url})});say('Month folder linked.');await openFeed(feed)}catch(err){say(err.message,true)}};block.append(mf);
          const months=await api(`/api/management/feeds/${feed.id}/years/${y.year}/months`);const monthList=document.createElement('div');monthList.className='months';for(const m of months){const item=document.createElement('div');item.className='month';const content=document.createElement('div');const monthName=document.createElement('strong');monthName.className='month-name';monthName.textContent=new Date(2000,m.month-1).toLocaleString(undefined,{month:'long'});const source=document.createElement('div');source.className='month-source muted small';source.textContent=m.source_url;const status=document.createElement('section');status.className='month-status muted small';status.setAttribute('aria-label','Refresh status');const statusTitle=document.createElement('div');statusTitle.className='month-status-title';statusTitle.textContent='Refresh status';const statusDetails=document.createElement('div');statusDetails.className='month-status-details';statusDetails.textContent=`Last attempt: ${m.last_attempt_at||'never'}\nNext refresh: ${m.next_refresh_at||'pending'}\nResult: ${m.last_result||'not run'}${m.last_error?`\nDetails: ${m.last_error}`:''}${m.active?'':'\nArchived'}`;status.append(statusTitle,statusDetails);content.append(monthName,source,status);const actions=document.createElement('div');actions.className='month-actions';if(m.active&&y.active){actions.append(actionButton('Fetch and parse','secondary',async()=>{await api(`/api/management/months/${m.id}/discover`,{method:'POST'});const docs=await api(`/api/management/months/${m.id}/documents`);let failures=0;for(const d of docs){try{await api(`/api/management/documents/${d.id}/extract`,{method:'POST'})}catch{failures++}}say(`Fetched ${docs.length} root PDFs; ${failures} extraction failures.`);await openFeed(feed)}),actionButton('Force refetch','secondary',async()=>{await api(`/api/management/months/${m.id}/refresh`,{method:'POST'});say('Month refetch queued.')}),actionButton('Review PDFs','secondary',async()=>review(m.id,item)),actionButton('Archive month','secondary',async()=>{if(!confirm(`Archive ${monthName.textContent}? Its entries will be hidden from refresh and RSS until restored.`))return;await api(`/api/management/months/${m.id}/archive`,{method:'POST'});say('Month archived.');await openFeed(feed)}))}else if(!m.active&&y.active){actions.append(actionButton('Restore month','secondary',async()=>{await api(`/api/management/months/${m.id}/restore`,{method:'POST'});say('Month restored.');await openFeed(feed)}))}actions.append(actionButton('Delete permanently','danger',async()=>{if(!confirm(`Permanently delete ${monthName.textContent} ${y.year}, its cached PDFs, and refresh history? This cannot be undone.`))return;await api(`/api/management/months/${m.id}`,{method:'DELETE'});say('Month permanently deleted.');await openFeed(feed)}));item.append(content,actions);monthList.append(item)}block.append(monthList);detail.append(block)}
      }
      async function review(monthId,container){const docs=await api(`/api/management/months/${monthId}/documents`);const list=document.createElement('div');for(const d of docs){const row=document.createElement('div');row.className='month';row.innerHTML='<div></div><select aria-label="Publication choice"><option value="">Use automatic decision</option><option value="include">Publish</option><option value="exclude">Skip promotional</option></select>';row.firstElementChild.textContent=`${d.filename} · automatic: ${d.promotional_classification} · extraction: ${d.extraction_status}${d.last_error?` · ${d.last_error}`:''}`;const select=row.querySelector('select');select.value=d.promotional_override||'';select.onchange=async()=>{await api(`/api/management/documents/${d.id}/promotion`,{method:'PUT',body:JSON.stringify({override_value:select.value||null})});say('Publication choice saved.')};list.append(row)}container.append(list)}
      $('#login-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/management/login',{method:'POST',body:JSON.stringify(formData(e.currentTarget))});await load()}catch(err){say(err.message,true)}};
      $('#feed-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;try{const f=await api('/api/management/feeds',{method:'POST',body:JSON.stringify(feedPayload(form))});form.reset();await load();await openFeed(f);say('Feed created.')}catch(err){say(err.message,true)}};
      $('#logout').onclick=async()=>{await api('/api/management/session',{method:'DELETE'});selected=null;await load()};load();
    </script>
  </body>
</html>
