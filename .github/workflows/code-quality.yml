name: Code quality and security scans

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Lint maintained shell scripts
        run: shellcheck ./scripts/*.sh

  python-lint:
    name: Ruff Python checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Lint Python E2E tooling
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.10
          src: tests/e2e
          args: check

  semgrep:
    name: Semgrep Community Edition
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan maintained application source
        run: semgrep scan --config auto --json --output semgrep-results.json src web/src scripts tests/e2e

      - name: Summarize findings
        if: always()
        run: |
          if [ -f semgrep-results.json ]; then
            count="$(python3 -c 'import json; print(len(json.load(open("semgrep-results.json"))["results"]))')"
            {
              echo "### Semgrep Community Edition"
              echo "Findings: ${count} (reported for review; findings do not currently fail the job)."
              echo "Full JSON report is attached as a workflow artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.json
          if-no-files-found: ignore
          retention-days: 14

  trivy-filesystem:
    name: Trivy dependency and configuration scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln,misconfig,secret
          format: json
          output: trivy-fs-results.json
          exit-code: "0"

      - name: Summarize Trivy findings
        if: always()
        run: |
          if [ -s trivy-fs-results.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-fs-results.json").read_text())
          results = report.get("Results", [])
          count = sum(
              len(result.get(key, []))
              for result in results
              for key in ("Vulnerabilities", "Misconfigurations", "Secrets")
          )
          print("### Trivy filesystem scan")
          print(f"Findings: {count} (reported for review; findings do not currently fail the job).")
          print("Full JSON report is attached as a workflow artifact.")
          PY
          fi

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs-results.json
          if-no-files-found: ignore
          retention-days: 14
