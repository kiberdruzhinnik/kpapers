name: Publish containers

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile.api
          - image: web
            context: ./web
            file: ./web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kpapers-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: |
            kpapers-${{ matrix.image }}:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan production image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: kpapers-${{ matrix.image }}:ci
          scanners: vuln,secret
          format: json
          output: trivy-image-${{ matrix.image }}.json
          exit-code: "0"

      - name: Summarize image findings
        if: always()
        env:
          IMAGE_NAME: ${{ matrix.image }}
          REPORT: trivy-image-${{ matrix.image }}.json
        run: |
          if [ -s "$REPORT" ]; then
            python3 - "$REPORT" "$IMAGE_NAME" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          results = report.get("Results", [])
          count = sum(len(result.get("Vulnerabilities", []) or []) for result in results)
          print(f"### Trivy image scan: {sys.argv[2]}")
          print(f"Vulnerabilities: {count} (reported for review; findings do not currently fail the job).")
          print("Full JSON report is attached as a workflow artifact.")
          PY
          fi

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.image }}
          path: trivy-image-${{ matrix.image }}.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image tags
        if: success() && github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
