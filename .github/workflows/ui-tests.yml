name: Frontend and integration checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Frontend, browser, and RSS checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run frontend lint and unit checks
        working-directory: web
        run: npm ci && npm run lint && npm test

      - name: Run browser and RSS integration checks
        run: ./scripts/integration-e2e.sh
        env:
          CI: "true"
