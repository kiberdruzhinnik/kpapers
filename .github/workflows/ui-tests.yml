name: UI and integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Component tests
        run: npm test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

  ui-browser:
    name: Playwright operator journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run isolated UI E2E suite
        run: ./scripts/ui-e2e.sh
        env:
          CI: "true"

  rss-contract:
    name: Miniflux RSS contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run isolated Miniflux contract suite
        run: bash ./scripts/e2e.sh

  production-web-image:
    name: Production web image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: false
          tags: kpapers-web:ci
          cache-from: type=gha,scope=web-ui-tests
          cache-to: type=gha,mode=max,scope=web-ui-tests
