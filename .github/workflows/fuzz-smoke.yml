name: Fuzz tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Seconds to fuzz each target
        required: true
        default: "1800"
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: Parser and PDF fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up nightly Rust with fuzz components
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-08
          components: llvm-tools-preview

      - name: Cache fuzz build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          cache-workspace-crates: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the pinned Pdfium runtime
        run: |
          docker build --target pdfium --tag kpapers-pdfium:ci --file Dockerfile.api .
          container="$(docker create kpapers-pdfium:ci)"
          mkdir -p "$RUNNER_TEMP/pdfium"
          docker cp "$container:/usr/local/lib/libpdfium.so" "$RUNNER_TEMP/pdfium/libpdfium.so"
          docker rm "$container"

      - name: Fuzz each target
        run: ./scripts/fuzz-smoke.sh
        env:
          PDFIUM_LIB_DIR: ${{ runner.temp }}/pdfium
          FUZZ_RUST_TOOLCHAIN: nightly-2026-11-08
          FUZZ_SMOKE_SECONDS: ${{ github.event_name == 'pull_request' && '15' || inputs.duration_seconds || '1800' }}
          FUZZ_OUTPUT_DIR: ${{ runner.temp }}/fuzz-data
          FUZZ_PRESERVE_OUTPUTS: ${{ github.event_name != 'pull_request' }}

      - name: Upload fuzz corpus and crash artifacts
        if: always() && (github.event_name != 'pull_request' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'fuzz-crash-artifacts' || 'extended-fuzz-data' }}
          path: ${{ runner.temp }}/fuzz-data
          if-no-files-found: ${{ github.event_name == 'pull_request' && 'ignore' || 'warn' }}
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
