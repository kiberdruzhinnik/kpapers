name: Fuzz smoke tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fuzz:
    name: Bounded parser and PDF fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up nightly Rust with fuzz components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the pinned Pdfium runtime
        run: |
          docker build --target pdfium --tag kpapers-pdfium:ci --file Dockerfile.api .
          container="$(docker create kpapers-pdfium:ci)"
          mkdir -p "$RUNNER_TEMP/pdfium"
          docker cp "$container:/usr/local/lib/libpdfium.so" "$RUNNER_TEMP/pdfium/libpdfium.so"
          docker rm "$container"

      - name: Run bounded fuzz smoke
        run: ./scripts/fuzz-smoke.sh
        env:
          PDFIUM_LIB_DIR: ${{ runner.temp }}/pdfium
          FUZZ_SMOKE_SECONDS: "15"
          FUZZ_OUTPUT_DIR: ${{ runner.temp }}/fuzz-data

      - name: Upload fuzz crash artifacts
        if: failure() && always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: ${{ runner.temp }}/fuzz-data
          if-no-files-found: ignore
          retention-days: 14
